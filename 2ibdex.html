.page{display:none;min-height:100vh;padding:24px 16px;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.page.active{display:flex}
h1{font-size:clamp(3rem,12vw,7rem);margin:0;letter-spacing:.04em;font-weight:800}
.start{margin-top:36px;padding:16px 44px;font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:rgba(47,91,255,.25);border:1px solid rgba(255,255,255,.55);border-radius:999px;cursor:pointer;backdrop-filter:blur(8px);transition:.25s}
.start:hover{background:var(--accent);box-shadow:0 0 40px rgba(47,91,255,.8)}
.start.reg{margin-top:16px;letter-spacing:0;text-transform:none;font-size:1.2rem;padding:14px 56px}
.name{margin-top:48px;font-size:1.15rem;letter-spacing:.35em;color:var(--muted);text-transform:lowercase}
#game{justify-content:flex-start;gap:16px}
.top{width:100%;max-width:1000px;display:flex;justify-content:space-between;align-items:center}
.back{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;padding:8px 18px;border-radius:999px;cursor:pointer}
.layout{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;width:100%;max-width:1000px;align-items:flex-start}
.wheelbox{position:relative;width:min(88vw,460px);aspect-ratio:1}
canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 0 30px rgba(47,91,255,.5))}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid #fff;z-index:2;filter:drop-shadow(0 2px 4px #000)}
.spin{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;border:3px solid #fff;background:var(--accent);color:#fff;font-weight:800;letter-spacing:.08em;cursor:pointer;z-index:3}
.spin:disabled{opacity:.6;cursor:default}
.panel{flex:1 1 280px;max-width:420px;background:var(--panel);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:18px;backdrop-filter:blur(10px);text-align:left}
.row{display:flex;gap:8px}
input,textarea{flex:1;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff;font-size:1rem;min-width:0}
.btn{padding:11px 16px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.35)}
.hint{font-size:.8rem;color:var(--muted);margin:8px 0}
ul{list-style:none;margin:10px 0 0;padding:0;max-height:240px;overflow-y:auto}
li{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.1)}
li button{background:none;border:0;color:#ff8a9a;cursor:pointer;font-size:1.1rem}
.count{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:.9rem}
#winner{min-height:2.2em;font-size:1.5rem;font-weight:800;color:#fff;text-shadow:0 0 20px var(--accent)}

#register{justify-content:flex-start;gap:28px}
.rname{font-size:clamp(1.6rem,6vw,2.6rem);letter-spacing:.35em;font-weight:800;text-transform:lowercase;text-shadow:0 0 24px #6a4bff;margin-top:8px}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:22px;backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:16px;text-align:left}
.card label{font-size:.85rem;color:var(--muted);letter-spacing:.08em}
.card input[type=text]{width:100%;flex:none}
.pic{width:140px;height:140px;border-radius:50%;border:2px dashed rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;margin:0 auto;overflow:hidden;cursor:pointer;color:var(--muted);text-align:center;font-size:.85rem;background:rgba(0,0,0,.3)}
.pic img{width:100%;height:100%;object-fit:cover}
.rtop{width:100%;max-width:420px;display:flex;justify-content:flex-start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;width:100%;max-width:900px}
.tile{background:var(--panel);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;backdrop-filter:blur(8px)}
.tile img,.tile .ph{width:96px;height:96px;border-radius:50%;object-fit:cover}
.ph{display:flex;align-items:center;justify-content:center;background:var(--accent);font-size:2rem;font-weight:800}
.tile b{word-break:break-word;text-align:center}
.rank{font-size:.75rem;color:var(--muted)}
.card .btn{width:100%}
.goalbox{width:100%;max-width:420px;background:var(--panel);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:18px;backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:12px}
.goalbox h3{margin:0;font-size:1.1rem;letter-spacing:.08em}
.goalbox .ball{font-size:1.6rem;margin-right:6px}
.goals{font-weight:700;color:#fff}
</style>
</head>
<body>
<section id="home" class="page active">
  <h1>SPIN</h1>
  <button class="start" id="startBtn">Press to start</button>
  <button class="start reg" id="regBtn">سجل</button>
  <div class="name">mahmoud shehata</div>
</section>

<section id="game" class="page">
  <div class="top"><button class="back" id="backBtn">← Back</button><div id="winner"></div><span style="width:70px"></span></div>
  <div class="layout">
    <div class="wheelbox">
      <div class="pointer"></div>
      <canvas id="wheel" width="800" height="800"></canvas>
      <button class="spin" id="spinBtn">SPIN</button>
    </div>
    <div class="panel">
      <div class="row"><input id="nameIn" placeholder="Add a name…" autocomplete="off"><button class="btn" id="addBtn">Add</button></div>
      <div class="hint">Unlimited names. Paste many at once, separated by commas or new lines.</div>
      <textarea id="bulk" rows="3" placeholder="Paste a list here…" style="width:100%"></textarea>
      <div class="tools">
        <button class="btn ghost" id="bulkBtn">Add list</button>
        <button class="btn ghost" id="clearBtn">Clear all</button>
      </div>
      <div class="count"><span id="count">0 names</span><label><input type="checkbox" id="rm" style="flex:none"> remove winner</label></div>
      <ul id="list"></ul>
    </div>
  </div>
</section>

<section id="register" class="page">
  <div class="rtop"><button class="back" id="regBack">← Back</button></div>
  <div class="rname">mahmoud shehata</div>
  <div class="card">
    <label for="uname">YOUR NAME</label>
    <input type="text" id="uname" placeholder="Enter your name" autocomplete="name">
    <label>YOUR PICTURE</label>
    <label class="pic" id="pic" for="upic"><span>Tap to add<br>your picture</span></label>
    <input type="file" id="upic" accept="image/*" hidden>
    <button class="btn" id="submitBtn">Join the board</button>
    <div class="hint" id="rmsg"></div>
    <button class="btn ghost" id="seeBoard">View board</button>
  </div>
</section>

<section id="board" class="page">
  <div class="rtop"><button class="back" id="boardBack">← Back</button></div>
  <div class="rname">the board</div>
  <div class="goalbox">
    <h3><span class="ball">⚽</span>MY GOALS IN THE MATCH</h3>
    <div class="row"><input type="number" id="goalsIn" min="0" max="99" inputmode="numeric" placeholder="How many goals did you score?"><button class="btn" id="saveGoals">Save</button></div>
    <div class="hint" id="gmsg"></div>
  </div>
  <div class="hint" id="boardNote"></div>
  <div class="grid" id="grid"></div>
</section>

<script>
const $=id=>document.getElementById(id);
let names=["Ali","Sara","Omar","Nour"],rot=0,spinning=false;
const cv=$("wheel"),ctx=cv.getContext("2d");
function show(id){document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===id));document.body.classList.toggle("reg",id==="register"||id==="board");if(id==="game")draw()}
$("startBtn").onclick=()=>show("game");
$("backBtn").onclick=()=>show("home");
$("regBtn").onclick=()=>show("register");
$("regBack").onclick=()=>show("home");
$("boardBack").onclick=()=>show("home");
$("seeBoard").onclick=()=>{renderBoard();show("board")};
let db=null,uid=null,entries=[],picData="",myLocal=null;
try{entries=JSON.parse(localStorage.getItem("board")||"[]");myLocal=localStorage.getItem("myLocal")}catch(e){}
function saveLocal(){if(db)return;try{localStorage.setItem("board",JSON.stringify(entries));if(myLocal)localStorage.setItem("myLocal",myLocal)}catch(e){}}
(async()=>{try{if(!window.claude)return;const u=await claude.use("user"),d=await claude.use("db");if(!d||!u)return;const id=await u.id();if(!id)return;uid=id;db=d;
db.collection("board").onSnapshot(s=>{entries=s.docs.map(x=>({id:x.id,...x.data()}));renderBoard()},()=>{})}catch(e){}})();
function toThumb(file){return new Promise(res=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const s=200,c=document.createElement("canvas");c.width=c.height=s;const m=Math.min(img.width,img.height);c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.8))};img.onerror=()=>res("");img.src=url})}
$("upic").addEventListener("change",async e=>{const f=e.target.files[0];picData=f?await toThumb(f):""});
function renderBoard(){
  const g=$("grid");g.innerHTML="";
  $("boardNote").textContent=entries.length?"":"No one has joined yet.";
  [...entries].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach((en,i)=>{
    const t=document.createElement("div");t.className="tile";
    const r=document.createElement("span");r.className="rank";r.textContent="#"+(i+1);
    let p;
    if(typeof en.pic==="string"&&en.pic.startsWith("data:image/jpeg;base64,")){p=document.createElement("img");p.src=en.pic;p.alt=""}
    else{p=document.createElement("div");p.className="ph";p.textContent=(en.name||"?").trim().charAt(0).toUpperCase()}
    const n=document.createElement("b");n.textContent=en.name||"";
    const gl=document.createElement("span");gl.className="goals";gl.textContent="⚽ "+(Number(en.goals)||0);
    t.append(r,p,n,gl);g.append(t);
  });
}
$("saveGoals").onclick=async()=>{
  const v=$("goalsIn").value,n=Math.floor(Number(v)),id=db?uid:myLocal,me=entries.find(x=>x.id===id);
  if(!me){$("gmsg").textContent="Join the board first, then enter your goals.";return}
  if(v===""||isNaN(n)||n<0||n>99){$("gmsg").textContent="Enter a number from 0 to 99.";return}
  if(db){try{await db.collection("board").doc(uid).update({goals:n})}catch(e){$("gmsg").textContent="Could not save. Please try again.";return}}
  else{me.goals=n;saveLocal()}
  $("gmsg").textContent="Saved ⚽ "+n;$("goalsIn").value="";renderBoard();
};
$("submitBtn").onclick=async()=>{
  const name=$("uname").value.trim();
  if(!name){$("rmsg").textContent="Please enter your name.";return}
  const old=entries.find(x=>x.id===(db?uid:myLocal))||{};
  const entry={name:name.slice(0,40),pic:picData,createdAt:old.createdAt||Date.now(),goals:old.goals||0};
  $("submitBtn").disabled=true;
  if(db){try{await db.collection("board").doc(uid).set(entry)}catch(e){$("rmsg").textContent="Could not save. Please try again.";$("submitBtn").disabled=false;return}}
  else{if(!myLocal){myLocal="l"+Date.now();entries.push({id:myLocal,...entry})}else{Object.assign(entries.find(x=>x.id===myLocal),entry)}saveLocal();$("boardNote").textContent="Saved on this device only."}
  $("submitBtn").disabled=false;$("rmsg").textContent="";
  renderBoard();show("board");
};
$("upic").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=document.createElement("img");img.src=r.result;img.alt="";$("pic").innerHTML="";$("pic").append(img)};r.readAsDataURL(f)};
function color(i,n){const h=205+(i*37%60)-20,l=i%2?38:22;return `hsl(${h},85%,${l+ (i%3)*6}%)`}
function draw(){
  const n=names.length,W=cv.width,c=W/2,r=c-14;
  ctx.clearRect(0,0,W,W);
  if(!n){ctx.fillStyle="rgba(255,255,255,.1)";ctx.beginPath();ctx.arc(c,c,r,0,7);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 36px sans-serif";ctx.textAlign="center";ctx.fillText("Add names",c,c+12);return}
  const seg=2*Math.PI/n;
  for(let i=0;i<n;i++){
    ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,rot+i*seg,rot+(i+1)*seg);ctx.closePath();
    ctx.fillStyle=color(i,n);ctx.fill();
    if(n<400){ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=n>150?.5:2;ctx.stroke()}
  }
  const fs=Math.min(40,Math.max(0,Math.floor(r*seg*.7)));
  if(fs>=9){
    ctx.fillStyle="#fff";ctx.font=`600 ${fs}px sans-serif`;ctx.textAlign="right";ctx.textBaseline="middle";
    for(let i=0;i<n;i++){
      ctx.save();ctx.translate(c,c);ctx.rotate(rot+(i+.5)*seg);
      let t=names[i];if(t.length>14)t=t.slice(0,13)+"…";
      ctx.fillText(t,r-18,0);ctx.restore();
    }
  }
  ctx.beginPath();ctx.arc(c,c,r,0,7);ctx.strokeStyle="#fff";ctx.lineWidth=6;ctx.stroke();
}
function renderList(){
  $("count").textContent=names.length+(names.length===1?" name":" names");
  const ul=$("list");ul.innerHTML="";
  names.forEach((n,i)=>{const li=document.createElement("li");const s=document.createElement("span");s.textContent=n;const b=document.createElement("button");b.textContent="✕";b.onclick=()=>{if(spinning)return;names.splice(i,1);renderList();draw()};li.append(s,b);ul.append(li)});
  draw();
}
function add(list){list.forEach(x=>{x=x.trim();if(x)names.push(x)});renderList()}
$("addBtn").onclick=()=>{add([$("nameIn").value]);$("nameIn").value="";$("nameIn").focus()};
$("nameIn").addEventListener("keydown",e=>{if(e.key==="Enter")$("addBtn").click()});
$("bulkBtn").onclick=()=>{add($("bulk").value.split(/[\n,]+/));$("bulk").value=""};
$("clearBtn").onclick=()=>{if(spinning)return;names=[];$("winner").textContent="";renderList()};
$("spinBtn").onclick=()=>{
  if(spinning||names.length<1)return;
  spinning=true;$("spinBtn").disabled=true;$("winner").textContent="";
  const n=names.length,start=rot,total=Math.PI*2*(6+Math.random()*4)+Math.random()*Math.PI*2,dur=5500,t0=performance.now();
  (function f(t){
    const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);
    rot=start+total*e;draw();
    if(p<1)return requestAnimationFrame(f);
    const seg=2*Math.PI/n,a=(((1.5*Math.PI-rot)%(2*Math.PI))+2*Math.PI)%(2*Math.PI),idx=Math.floor(a/seg)%n;
    $("winner").textContent="🎉 "+names[idx];
    if($("rm").checked){names.splice(idx,1);renderList()}
    spinning=false;$("spinBtn").disabled=false;
  })(t0);
};
renderList();
</script>
